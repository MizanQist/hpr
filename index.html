<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPR</title>
<meta name="description" content="HPR. Private dealer in fine watches.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html { background: #000; scroll-behavior: auto; }
  body {
    background: #000;
    color: #f2f2f0;
    font: 300 15px/1.5 -apple-system, "Helvetica Neue", Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
    pointer-events: none;
  }
  /* tablet and up: show the whole frame, watch centred with room above and below; phones keep cover */
  @media (min-width: 768px) { video { object-fit: contain; } }
  main { position: relative; z-index: 1; }
  section {
    min-height: 100svh;
    display: grid;
    align-content: end;
    padding: 0 max(24px, 5vw) max(32px, env(safe-area-inset-bottom, 0px) + 6vh);
  }
  /* the video's last frame carries a baked caption at the bottom; keep the contact block clear of it */
  section:last-child {
    align-content: start;
    padding-top: max(32px, env(safe-area-inset-top, 0px) + 6vh);
  }
  main { text-shadow: 0 1px 24px rgba(0,0,0,.7); }
  h1, h2 { font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  h1 { font-size: clamp(56px, 12vw, 160px); letter-spacing: 0.08em; }
  h2 { font-size: clamp(34px, 6vw, 84px); }
  small { display: block; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: .55; margin-bottom: 14px; }
  p { max-width: 34ch; margin-top: 14px; opacity: .8; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.3); }
  a:hover { border-color: currentColor; }
</style>
</head>
<body>

<video muted playsinline preload="auto" aria-hidden="true"></video>

<main>
  <section>
    <h1>HPR</h1>
    <p>Private watch dealer.</p>
  </section>

  <section>
    <small>01</small>
    <h2>Sourced</h2>
    <p>Rare references, found on request.</p>
  </section>

  <section>
    <small>02</small>
    <h2>Verified</h2>
    <p>Every piece authenticated before it changes hands.</p>
  </section>

  <section>
    <small>03</small>
    <h2>Delivered</h2>
    <p>Discreetly, anywhere in the world.</p>
  </section>

  <section>
    <small>Enquiries</small>
    <h2>By appointment</h2>
    <p><a href="https://wa.me/2340000000000">WhatsApp</a> &nbsp;·&nbsp; <a href="https://instagram.com/hpr">Instagram</a></p>
  </section>
</main>

<script>
  const video = document.querySelector('video');
  // landscape viewports get the 16:9 render, portrait ones the 9:16 render; chosen once at load
  const wide = matchMedia('(orientation: landscape)').matches;
  video.poster = wide ? 'media/poster-wide.jpg' : 'media/poster.jpg';
  const file = wide ? 'media/watch-wide.mp4' : 'media/watch.mp4';
  video.pause();

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    video.src = file;
  } else {
    let target = 0, current = 0, last = performance.now();

    const onScroll = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      const progress = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
      target = progress * (video.duration || 0);
    };

    const tick = (now) => {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      current += (target - current) * (1 - Math.exp(-dt * 8));
      if (Math.abs(video.currentTime - current) > 0.004) video.currentTime = current;
      requestAnimationFrame(tick);
    };

    // iOS renders seeks only once the decoder has started: start it and pause straight away.
    // If that is blocked (Low Power Mode), retry on the first touch.
    const prime = () => video.play().then(() => video.pause())
      .catch(() => addEventListener('touchend', prime, { once: true }));

    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll);
    video.addEventListener('loadedmetadata', () => { onScroll(); prime(); requestAnimationFrame(tick); }, { once: true });

    // iOS ignores preload and shows nothing for seeks into unloaded ranges, so load the whole clip first
    fetch(file).then(r => r.ok ? r.blob() : Promise.reject(r.status))
      .then(blob => { video.src = URL.createObjectURL(blob); })
      .catch(() => { video.src = file; });
  }
</script>
</body>
</html>
